services:
  - type: web
    name: videoteks
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_API_KEY_2
        sync: false
      - key: GEMINI_API_KEY_3
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: YOUTUBE_CLIENT_ID
        sync: false
      - key: YOUTUBE_CLIENT_SECRET
        sync: false
      - key: YOUTUBE_TOKEN_ENCRYPTION_KEY
        sync: false
      - key: YOUTUBE_REDIRECT_URI
        value: https://shopppit1-tech.github.io
      - key: GEMINI_YOUTUBE_API_KEY
        sync: false
      - key: GEMINI_YOUTUBE_MODEL
        value: gemini-3.8-flash
