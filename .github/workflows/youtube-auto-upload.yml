name: Daily YouTube upload from Drive

on:
  schedule:
    - cron: '0,5,10,15,20,25,30,35,40,45,50,55 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force an additional public upload today.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-drive-daily-upload
  cancel-in-progress: false

jobs:
  process-drive-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Call the authenticated VideoTeks upload worker
        env:
          API_URL: https://terjemah-video.onrender.com/api/internal/youtube-auto-upload/run
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=videoteks-youtube-daily-upload" | jq -er '.value')"
          curl --fail --silent --show-error --max-time 3300 \
            -X POST "$API_URL" \
          -H "Authorization: Bearer ${OIDC_TOKEN}" \
          -H 'Content-Type: application/json' \
          --data '{"force": ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}}'
