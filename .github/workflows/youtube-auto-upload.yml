name: Daily YouTube upload from Drive

on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force an additional public upload today.'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: youtube-drive-daily-upload
  cancel-in-progress: false

jobs:
  process-drive-queue:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Call the authenticated VideoTeks upload worker
        env:
          API_URL: https://terjemah-video.onrender.com/api/internal/youtube-auto-upload/run
        run: |
          set -euo pipefail
          OIDC_TOKEN="$(curl --fail --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=videoteks-youtube-daily-upload" | jq -er '.value')"
          curl --fail --silent --show-error --max-time 3300 \
            -X POST "$API_URL" \
          -H "Authorization: Bearer ${OIDC_TOKEN}" \
          -H 'Content-Type: application/json' \
          --data '{"force": ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}}' > run.json
          RUN_STARTED_AT="$(jq -er '.runStartedAt' run.json)"
          JOB_COUNT="$(jq -er '.jobCount' run.json)"
          STATUS_URL="${API_URL%/run}/status?since=${RUN_STARTED_AT}&expected=${JOB_COUNT}"
          for attempt in $(seq 1 180); do
            OIDC_TOKEN="$(curl --fail --silent --show-error \
              -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=videoteks-youtube-daily-upload" | jq -er '.value')"
            STATUS="$(curl --fail --silent --show-error --max-time 30 \
              -H "Authorization: Bearer ${OIDC_TOKEN}" "$STATUS_URL")"
            echo "$STATUS"
            if jq -e '.done == true' >/dev/null <<<"$STATUS"; then
              if jq -e '.hasErrors == true' >/dev/null <<<"$STATUS"; then
                echo 'VideoTeks upload worker reported an error.' >&2
                exit 1
              fi
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for the VideoTeks upload worker.' >&2
          exit 1
