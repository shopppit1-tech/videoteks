<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101822">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="auth-shell.css">
  <script src="page-navigation.js" defer></script>
  <script>document.documentElement.classList.add('auth-pending')</script>
  <script id="googleIdentityScript" src="https://accounts.google.com/gsi/client" async defer></script>
  <title>Upload YouTube — VideoTeks</title>
  <style>
    :root{--bg:#0c141d;--panel:#202a35;--muted:#aeb8c6;--white:#f7f8fb;--accent:#ff3b4e;--purple:#8b5cf6;--blue:#35a9ff}
    *{box-sizing:border-box}
    html{height:auto!important;min-height:100%;overflow-y:auto!important;overflow-x:hidden!important}
    html,body{margin:0;min-height:100%;height:auto!important;background:var(--bg);color:var(--white);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overscroll-behavior-y:auto!important}
    body{min-height:100dvh;overflow-y:scroll!important;overflow-x:hidden!important;-webkit-overflow-scrolling:touch!important;touch-action:pan-y!important}
    .youtube-app{width:min(100%,520px);min-height:100dvh;height:auto!important;max-height:none!important;overflow:visible!important;margin:auto;padding:12px 14px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px;background:linear-gradient(180deg,#111a24,#0f1821)}
    .page-nav{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:5px;flex:0 0 auto}.page-nav a{min-width:0;text-align:center;text-decoration:none;color:#dbe1e9;background:#202a35;border:1px solid #ffffff18;border-radius:11px;padding:8px 4px;font-size:10px;line-height:1.2;font-weight:750;white-space:normal}.page-nav a:hover{border-color:#9c5eff}
    .hero{padding:4px 2px 2px}.eyebrow{margin:0 0 7px;color:#ff8992;font-size:10px;font-weight:850;letter-spacing:1.4px;text-transform:uppercase}.hero h1{margin:0;font-size:clamp(25px,7vw,34px);line-height:1.08;letter-spacing:-.8px}.hero p:last-child{margin:8px 0 0;color:var(--muted);font-size:13px;line-height:1.5}
    .card{padding:14px;background:var(--panel);border:1px solid #ffffff0d;border-radius:17px;box-shadow:0 12px 32px #0002}.card-title{margin:0 0 6px;font-size:14px}.muted{margin:0;color:var(--muted);font-size:11px;line-height:1.5}
    .account-row{display:flex;align-items:center;gap:10px}.account-mark{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:13px;background:#ff33441c;color:#ff6976;font-size:20px}.account-copy{min-width:0;flex:1}.account-copy strong{display:block;font-size:12px}.account-copy small{display:block;margin-top:3px;color:var(--muted);font-size:10px;line-height:1.35}.account-actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:6px}
    button,input,textarea,select{font:inherit}.btn{border:0;border-radius:10px;padding:10px 13px;background:linear-gradient(100deg,#ff3b4e,#c52c56);color:#fff;font-size:11px;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.secondary{border:1px solid #ffffff22;background:#ffffff0c;color:#e9edf3}.btn.danger{border:1px solid #ff758055;background:#ff3b4e15;color:#ffc8ce}
    .field{display:grid;gap:6px;margin-top:12px}.field label{font-size:11px;font-weight:750}.field small{color:var(--muted);font-size:10px;line-height:1.4}.text,.select{width:100%;border:1px solid #ffffff18;border-radius:10px;background:#18222c;color:#fff;font:inherit;font-size:12px;outline:none}.text{padding:11px}.text:focus,.select:focus{border-color:#a76cff;box-shadow:0 0 0 2px #8b5cf622}.text.single{height:42px}.text.description{min-height:112px;resize:vertical;line-height:1.5}.select{padding:10px}
    .file-pick{display:flex;align-items:center;gap:11px;padding:13px;border:1px dashed #ffffff38;border-radius:13px;background:#18222c;cursor:pointer}.file-pick:hover{border-color:#ff6976}.file-icon{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:11px;background:#ff3b4e1c;color:#ff8992;font-size:18px}.file-copy{min-width:0}.file-copy strong{display:block;font-size:12px}.file-copy small{display:block;margin-top:4px;color:var(--muted);font-size:10px;line-height:1.4}.file-name{display:block;max-width:100%;margin-top:7px;overflow:hidden;color:#d9c7ff;font-size:11px;text-overflow:ellipsis;white-space:nowrap}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    .handoff-hint{margin:10px 0 0;padding:9px 10px;border:1px solid #8b5cf644;border-radius:9px;background:#8b5cf61a;color:#e6dcff;font-size:10px;line-height:1.45}.handoff-hint[hidden]{display:none}.seo-button{width:100%;margin-top:7px}.privacy-note{margin:12px 0 0;padding:10px 11px;border:1px solid #ffffff12;border-radius:10px;background:#111a24;color:#bdc6d2;font-size:10px;line-height:1.5}.rights{display:flex;align-items:flex-start;gap:9px;margin-top:13px;color:#d5dbe4;font-size:10px;line-height:1.45}.rights input{margin:2px 0 0;accent-color:#ff5260}.upload-btn{width:100%;margin-top:14px;padding:12px}.progress{height:8px;margin-top:12px;overflow:hidden;border-radius:999px;background:#111a24}.progress[hidden]{display:none}.progress-fill{width:0;height:100%;border-radius:inherit;background:linear-gradient(90deg,#ff3b4e,#a855f7);transition:width .12s linear}.status{min-height:16px;margin-top:10px;color:#aeb8c6;text-align:center;font-size:11px;line-height:1.5}.status.error{color:#fb7185}.success-link{display:block;margin-top:10px;padding:10px;border:1px solid #a76cff55;border-radius:10px;background:#8b5cf633;color:#fff;text-align:center;text-decoration:none;font-size:11px;font-weight:750}.success-link[hidden]{display:none}
    @media(max-width:360px){.account-row{align-items:flex-start;flex-wrap:wrap}.account-actions{width:100%;justify-content:flex-start}.page-nav{gap:5px}.page-nav a{font-size:9px;padding-inline:3px}}
  </style>
</head>
<body>
  <header class="auth-bar">
    <div class="auth-bar__actions">
      <a href="history.html">Riwayat</a>
      <div class="profile-wrap">
        <button class="profile-button" type="button" data-profile-trigger aria-label="Buka menu profil" aria-haspopup="menu" aria-expanded="false" aria-controls="profileMenu">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5.5 20c.7-3.8 3-5.7 6.5-5.7s5.8 1.9 6.5 5.7"></path></svg>
        </button>
        <div id="profileMenu" class="profile-menu" data-profile-menu role="menu" hidden>
          <p class="profile-email" data-account-email>Memuat email…</p>
          <a href="terms.html" role="menuitem">Syarat Penggunaan / Terms of Use</a><a href="privacy.html" role="menuitem">Kebijakan Privasi</a>
          <a href="delete-account.html" role="menuitem">Hapus akun &amp; data</a>
          <button class="profile-menu__signout" type="button" data-sign-out role="menuitem">Keluar</button>
        </div>
      </div>
    </div>
  </header>
  <main class="youtube-app">
    <nav class="page-nav" aria-label="Pilih fitur VideoTeks">
      <a href="app.html">Subtitle Video</a>
      <a href="audio.html">Ganti Audio</a>
      <a href="voice.html">Suara AI</a>
      <a class="active" href="youtube.html" aria-current="page">YouTube</a>
    </nav>
    <section class="card" aria-labelledby="accountTitle">
      <h2 id="accountTitle" class="card-title">Akun YouTube</h2>
      <div class="account-row">
        <div class="account-mark" aria-hidden="true">▶</div>
        <div class="account-copy">
          <strong id="accountLabel">Belum terhubung</strong>
          <small id="accountHint" hidden></small>
        </div>
        <div class="account-actions">
          <button id="connectButton" class="btn" type="button" disabled>Hubungkan akun</button>
          <button id="disconnectButton" class="btn secondary" type="button" hidden>Lepas</button>
        </div>
      </div>
    </section>
    <form id="uploadForm" class="card">
      <h2 class="card-title">Detail video</h2>
      <label class="file-pick" for="videoFile">
        <span class="file-icon" aria-hidden="true">＋</span>
        <span class="file-copy"><strong>Pilih video dari perangkat</strong><span id="fileName" class="file-name">Belum ada video dipilih</span></span>
      </label>
      <input id="videoFile" class="sr-only" type="file" accept="video/*">
      <p id="handoffHint" class="handoff-hint" hidden></p>
      <div class="field">
        <label for="videoTitle">Judul Short / video</label>
        <input id="videoTitle" class="text single" type="text" maxlength="100" required placeholder="Tulis judul video">
        <small><span id="titleCount">0</span>/100 karakter</small>
      </div>
      <div class="field">
        <label for="videoDescription">Deskripsi</label>
        <textarea id="videoDescription" class="text description" maxlength="5000" placeholder="Tambahkan konteks, tautan, atau tagar untuk video"></textarea>
        <small><span id="descriptionCount">0</span>/5.000 karakter</small>
      </div>
      <div class="field" hidden>
        <label for="seoTopic">Topik atau kata kunci SEO (opsional)</label>
        <input id="seoTopic" class="text single" type="text" maxlength="240" placeholder="Contoh: tips belajar bahasa Inggris">
        <small id="seoHint"></small>
        <button id="seoButton" class="btn secondary seo-button" type="button">Buat judul &amp; deskripsi SEO (Gemini)</button>
      </div>
      <small id="seoTagsHint" class="muted"></small>
      <input id="seoContentConsent" type="checkbox" checked hidden>
      <select id="privacyStatus" class="select" hidden aria-hidden="true">
        <option value="private" selected>Privat — hanya Anda</option>
        <option value="unlisted">Tidak publik — hanya yang memiliki tautan</option>
        <option value="public">Publik — dapat ditemukan semua orang</option>
      </select>
      <input id="rightsCheck" type="checkbox" checked hidden>
      <button id="uploadButton" class="btn upload-btn" type="submit" disabled>Upload ke YouTube</button>
      <div id="progress" class="progress" hidden><div id="progressFill" class="progress-fill"></div></div>
      <div id="status" class="status" aria-live="polite">Pilih video untuk membuat metadata otomatis.</div>
      <a id="successLink" class="success-link" target="_blank" rel="noopener noreferrer" hidden>Lihat video yang diunggah</a>
    </form>
  </main>
  <script type="module" src="youtube.js?v=seo-video-content-3"></script>
</body>
</html>
