<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c141d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script src="page-navigation.js" defer></script>
  <style>html,body{overscroll-behavior-y:none}</style>
  <title>VideoTeks Studio</title>
  <style>
    *{box-sizing:border-box}
    html,body{width:100%;min-height:100%;margin:0;overflow-x:hidden;overflow-y:auto;background:#0c141d;color:#f7f8fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;touch-action:pan-y;-webkit-overflow-scrolling:touch}
    #screenHost{position:relative;min-height:100dvh;overflow:visible;background:radial-gradient(ellipse at 50% 0,#253452 0%,#111a24 46%,#0c141d 82%)}
    #screenHost iframe{position:relative;display:block;width:100%;min-height:100dvh;height:100dvh;border:0;background:#0c141d;overflow:hidden;touch-action:pan-y}
    #screenHost iframe[hidden]{display:none!important}
    #shellBoot{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:12px;background:radial-gradient(ellipse at 50% 38%,#263650 0%,#172434 42%,#0c141d 86%);text-align:center}
    #shellBoot[hidden]{display:none}
    .boot-mark{width:52px;height:52px;display:grid;place-items:center;border:1px solid #ffffff30;border-radius:17px;background:linear-gradient(145deg,#a855f7,#38bdf8);color:#fff;font-size:28px;font-weight:900;box-shadow:0 12px 38px #5b21b655}
    .boot-name{margin:0;font-size:17px;font-weight:800;letter-spacing:.2px}
  </style>
</head>
<body>
  <main id="screenHost" aria-label="VideoTeks Studio">
    <div id="shellBoot" aria-live="polite"><div class="boot-mark" aria-hidden="true">V</div><p class="boot-name">VideoTeks</p></div>
  </main>
  <script type="module" src="studio.js"></script>
</body>
</html>
